<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AutoHelp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/*
  Design system note: this product commits to a single deep-dark, premium
  "control room" identity (the brief explicitly asks for it), so tokens are
  defined once rather than branched by light/dark preference.
*/
:root{
  --bg:#05070A;
  --bg-1:#0A0E14;
  --bg-2:#0D131B;
  --glass: rgba(255,255,255,0.045);
  --glass-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.18);
  --text:#F3F6F9;
  --text-muted:#8D98A6;
  --text-dim:#5B6572;
  --accent:#4DD9EC;
  --accent-2:#8C7CFF;
  --accent-bright:#8CEBF6;
  --accent-soft: rgba(77,217,236,0.12);
  --gold:#E9C878;
  --safe:#34E6A8;
  --caution:#F2C14E;
  --danger:#FF5C7A;
  --safe-soft: rgba(52,230,168,0.12);
  --caution-soft: rgba(242,193,78,0.12);
  --danger-soft: rgba(255,92,122,0.12);
  --radius:18px;
  --radius-sm:12px;
  --shadow-sm: 0 1px 0 rgba(255,255,255,0.05) inset, 0 10px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 1px 0 rgba(255,255,255,0.06) inset, 0 30px 70px rgba(0,0,0,0.55);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{ height:100%; margin:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans","Segoe UI",sans-serif;
  padding:0 16px; padding-block:0;
  min-height:100%;
  position:relative;
  overflow-x:hidden;
}
h1,h2,h3,.disp{ font-family:"Manrope","Segoe UI",sans-serif; letter-spacing:-0.01em; text-wrap:balance; }
.mono{ font-family:"IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
a{ color:var(--accent); }
button{ font-family:inherit; }
[hidden]{ display:none!important; }
::selection{ background:var(--accent-2); color:#05070A; }
img{ max-width:100%; }

/* ---------- ambient background layers ---------- */
#bgCanvas{ position:fixed; inset:0; z-index:-3; width:100%; height:100%; opacity:.55; }
.bg-mesh{
  position:fixed; inset:-20% -20% auto -20%; height:70vh; z-index:-2; pointer-events:none;
  background:
    radial-gradient(680px 360px at 14% -4%, rgba(77,217,236,0.16), transparent 62%),
    radial-gradient(560px 320px at 90% 4%, rgba(140,124,255,0.14), transparent 62%),
    radial-gradient(420px 260px at 55% 22%, rgba(233,200,120,0.06), transparent 65%);
}
.bg-grid{
  position:fixed; inset:0; z-index:-3; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image: radial-gradient(700px 460px at 50% 0%, #000 20%, transparent 78%);
  -webkit-mask-image: radial-gradient(700px 460px at 50% 0%, #000 20%, transparent 78%);
}
#cursorGlow{
  position:fixed; top:0; left:0; width:460px; height:460px; margin:-230px 0 0 -230px;
  border-radius:50%; pointer-events:none; z-index:-2; opacity:0;
  background: radial-gradient(circle, rgba(77,217,236,0.10), rgba(140,124,255,0.05) 45%, transparent 70%);
  will-change:transform, opacity; transition:opacity .4s ease;
}

@media (prefers-reduced-motion: no-preference){
  .bg-mesh{ animation:driftGlow 30s ease-in-out infinite; }
  @keyframes driftGlow{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(16px) scale(1.03); } }

  .reveal{ animation:reveal .7s cubic-bezier(.16,.8,.24,1) both; }
  .reveal.r1{ animation-delay:.02s; } .reveal.r2{ animation-delay:.11s; }
  .reveal.r3{ animation-delay:.2s; } .reveal.r4{ animation-delay:.29s; } .reveal.r5{ animation-delay:.38s; }
  @keyframes reveal{ from{ opacity:0; transform:translateY(18px) scale(.985); filter:blur(6px); } to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); } }

  .card{ transition:transform .22s cubic-bezier(.16,.8,.24,1), border-color .22s ease, box-shadow .22s ease; }
  .card:hover{ transform:translateY(-2px); border-color:var(--border-strong); box-shadow:var(--shadow-lg), 0 0 0 1px rgba(77,217,236,0.06); }

  .icon-card{ transition:transform .18s cubic-bezier(.16,.8,.24,1), box-shadow .18s ease, border-color .18s ease; }
  .icon-card:hover{ transform:translateY(-4px); box-shadow:0 16px 30px rgba(0,0,0,.4), 0 0 0 1px var(--accent-soft); }
  .icon-card:active{ transform:translateY(-1px) scale(.98); }
  .icon-card .ic-badge{ transition:transform .18s ease; }
  .icon-card:hover .ic-badge{ transform:scale(1.1); }
  .icon-card.selected{ animation:selectPulse .7s ease; }
  @keyframes selectPulse{ 0%{ box-shadow:0 0 0 0 var(--accent-soft); } 70%{ box-shadow:0 0 0 12px rgba(0,0,0,0); } 100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); } }
  .icon-card.selected .ic-badge{ animation:badgeGlowPulse 2.4s ease-in-out infinite; }
  @keyframes badgeGlowPulse{ 0%,100%{ filter:drop-shadow(0 0 0 transparent); } 50%{ filter:drop-shadow(0 0 8px currentColor); } }

  #resultCard:not([hidden]){ animation:resultIn .55s cubic-bezier(.16,.8,.24,1); }
  @keyframes resultIn{ from{ opacity:0; transform:translateY(16px) scale(.96); filter:blur(8px); } to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); } }
  .sev-banner{ background-size:240% 240%; animation:gradientShift 9s ease infinite; }
  @keyframes gradientShift{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  .sev-banner::after{ content:""; position:absolute; inset:0; opacity:.5; animation:breathe 4.5s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.35; } 50%{ opacity:.65; } }
  .checklist li{ animation:reveal .45s cubic-bezier(.16,.8,.24,1) both; }
  .checklist li:nth-child(1){ animation-delay:.06s; } .checklist li:nth-child(2){ animation-delay:.14s; }
  .checklist li:nth-child(3){ animation-delay:.22s; } .checklist li:nth-child(4){ animation-delay:.3s; }
  .checklist li svg path{ stroke-dasharray:20; stroke-dashoffset:20; animation:draw .35s ease forwards .3s; }
  .checklist li:nth-child(2) svg path{ animation-delay:.38s; } .checklist li:nth-child(3) svg path{ animation-delay:.46s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .btn{ transition:transform .14s cubic-bezier(.16,.8,.24,1), box-shadow .18s ease, filter .18s ease; }
  .btn:hover{ filter:brightness(1.08); }
  .btn.primary:hover{ box-shadow:0 10px 28px rgba(77,217,236,0.28); }
  .btn:active{ transform:scale(.96); }
  .btn .ripple{ position:absolute; border-radius:50%; background:rgba(255,255,255,0.35); transform:scale(0); opacity:.6; animation:rippleFx .55s ease-out forwards; pointer-events:none; }
  @keyframes rippleFx{ to{ transform:scale(2.6); opacity:0; } }

  .pillnav button, .langsw button{ transition:color .2s ease; }
  .pill-ind, .lang-ind{ transition:transform .32s cubic-bezier(.2,.9,.2,1.1), width .32s cubic-bezier(.2,.9,.2,1.1); }

  .instrument{ animation:heroIn .8s cubic-bezier(.16,.8,.24,1) .1s both; }
  @keyframes heroIn{ from{ opacity:0; transform:scale(.94) translateY(8px); filter:blur(8px); } to{ opacity:1; transform:scale(1) translateY(0); filter:blur(0); } }
  .gauge-needle{ transform:rotate(-58deg); animation:needleSweep 2.4s cubic-bezier(.5,.05,.15,1) .5s 1 both, needleIdle 4.2s ease-in-out 2.9s infinite; }
  @keyframes needleSweep{ from{ transform:rotate(-58deg); } to{ transform:rotate(26deg); } }
  @keyframes needleIdle{ 0%,100%{ transform:rotate(26deg); } 50%{ transform:rotate(16deg); } }
  .arc-glow{ animation:arcPulse 3.2s ease-in-out infinite; }
  @keyframes arcPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .mini-ring-fill{ animation:ringSweep 1.6s cubic-bezier(.16,.8,.24,1) .3s both; }
  @keyframes ringSweep{ from{ stroke-dashoffset:100; } }
  .wave-path{ animation:waveMove 3.6s linear infinite; }
  @keyframes waveMove{ from{ stroke-dashoffset:0; } to{ stroke-dashoffset:-80; } }
  .status-dot{ animation:dotPulse 2.2s ease-in-out infinite; }
  @keyframes dotPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(52,230,168,.5); } 50%{ box-shadow:0 0 0 5px rgba(52,230,168,0); } }
  .float-chip{ animation:floatY 4.8s ease-in-out infinite; }
  .float-chip.b2{ animation-delay:.6s; } .float-chip.b3{ animation-delay:1.3s; }
  @keyframes floatY{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }

  .edit-panel:not([hidden]){ animation:reveal .35s ease both; }
  .stat-tile{ animation:reveal .55s cubic-bezier(.16,.8,.24,1) both; }
  .stat-tile:nth-child(1){ animation-delay:.02s; } .stat-tile:nth-child(2){ animation-delay:.08s; }
  .stat-tile:nth-child(3){ animation-delay:.14s; } .stat-tile:nth-child(4){ animation-delay:.2s; }
}
@media (prefers-reduced-motion: reduce){
  .gauge-needle{ transform:rotate(-14deg); }
  .mini-ring-fill{ stroke-dashoffset:35; }
}

.wrap{ max-width:1040px; margin:0 auto; }

/* ---------- header ---------- */
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:rgba(5,7,10,0.72); backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--border);
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
.topbar{ display:flex; align-items:center; gap:14px; padding:0 0 12px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
.brand .mark{ position:relative; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
.brand .mark svg{ width:26px; height:26px; color:var(--accent); filter:drop-shadow(0 0 6px rgba(77,217,236,.5)); }
.brand .status-dot{ position:absolute; bottom:-1px; right:-1px; width:8px; height:8px; border-radius:50%; background:var(--safe); border:2px solid var(--bg); }
.brand span{ font-family:"Manrope"; font-weight:800; font-size:19px; letter-spacing:-0.01em; }
.pillnav, .langsw{ display:flex; gap:2px; background:var(--glass); border:1px solid var(--border); border-radius:999px; padding:3px; position:relative; backdrop-filter:blur(6px); }
.pill-ind, .lang-ind{ position:absolute; top:3px; bottom:3px; left:3px; width:60px; border-radius:999px; background:var(--glass-hover); box-shadow:0 0 0 1px var(--border-strong) inset, 0 4px 14px rgba(0,0,0,.35); z-index:0; }
.pillnav button, .langsw button{
  border:none; background:none; color:var(--text-muted); padding:7px 14px; border-radius:999px;
  font-size:13px; font-weight:600; cursor:pointer; position:relative; z-index:1;
}
.langsw button{ padding:6px 11px; font-size:12px; letter-spacing:.03em; }
.pillnav button.active, .langsw button.active{ color:var(--text); }

main{ padding-block:30px 70px; position:relative; }
.eyebrow{ color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
.eyebrow::before{ content:""; width:16px; height:1px; background:var(--accent); box-shadow:0 0 6px var(--accent); }
h1.hero{
  font-size:clamp(32px,5.4vw,58px); margin:12px 0 14px; font-weight:800; line-height:1.05; letter-spacing:-0.025em;
  background:linear-gradient(180deg,#FFFFFF 20%, #A9B7C4 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
}
p.lead{ color:var(--text-muted); font-size:16px; max-width:56ch; margin:0 0 26px; line-height:1.6; }

.hero-row{ display:flex; align-items:center; gap:36px; flex-wrap:wrap; margin-bottom:8px; }
.hero-copy{ flex:1 1 340px; min-width:280px; }
.instrument{
  position:relative; flex:0 0 280px; width:280px; padding:20px 18px 16px;
  background:linear-gradient(180deg, var(--glass), rgba(255,255,255,0.015));
  border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-lg);
  backdrop-filter:blur(10px);
}
.instrument .ihead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.instrument .ihead .tag{ font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); font-weight:600; }
.instrument .ihead .live{ display:flex; align-items:center; gap:5px; font-size:9.5px; letter-spacing:.1em; color:var(--safe); font-weight:600; }
.instrument .ihead .live .status-dot{ width:6px; height:6px; border-radius:50%; background:var(--safe); }
.instrument svg{ width:100%; height:auto; overflow:visible; }
@media (max-width:680px){ .instrument{ display:none; } }
.mini-rings{ display:flex; gap:10px; margin-top:6px; }
.mini-ring{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.mini-ring .rlabel{ font-size:8.5px; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase; }
.float-chip{
  position:absolute; width:36px; height:36px; border-radius:11px; background:var(--glass-hover);
  border:1px solid var(--border-strong); box-shadow:0 8px 20px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(6px);
}
.float-chip svg{ width:17px; height:17px; }
.float-chip.b1{ top:-10px; left:-10px; color:var(--caution); }
.float-chip.b2{ top:36%; right:-14px; color:var(--danger); }
.float-chip.b3{ bottom:-10px; left:30%; color:var(--safe); }

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg, var(--glass), rgba(255,255,255,0.015));
  border:1px solid var(--border); border-radius:var(--radius);
  padding:22px; box-shadow:var(--shadow-sm); margin-bottom:18px; backdrop-filter:blur(10px);
  position:relative;
}
.card h2{ font-size:15px; font-weight:700; margin:0 0 16px; display:flex; align-items:center; gap:10px; }
.card h2 .num{
  width:24px; height:24px; border-radius:8px; background:var(--accent-soft); color:var(--accent-bright);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-family:"IBM Plex Mono"; flex:none;
  border:1px solid rgba(77,217,236,.25);
}

.row{ display:grid; grid-template-columns:1.1fr 1.1fr .7fr; gap:14px; }
@media (max-width:640px){ .row{ grid-template-columns:1fr 1fr; } .row > *:last-child{ grid-column:1/-1; } }
label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:500; }
input,select,textarea{
  width:100%; background:rgba(255,255,255,0.035); border:1px solid var(--border); border-radius:10px;
  padding:10px 12px; font-size:14px; color:var(--text); font-family:inherit;
}
input::placeholder, textarea::placeholder{ color:var(--text-dim); }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
textarea{ resize:vertical; min-height:64px; }

.methodsw{ display:flex; gap:8px; margin-bottom:16px; }
.methodsw button{
  flex:1; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text-muted);
  padding:10px; border-radius:11px; font-size:13px; font-weight:600; cursor:pointer; transition:.16s ease;
}
.methodsw button.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-bright); }

.searchbox{ position:relative; margin-bottom:14px; }
.searchbox svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-dim); }
.searchbox input{ padding-left:34px; }

.gallery{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
@media (max-width:640px){ .gallery{ grid-template-columns:repeat(3,1fr); } }
.icon-card{
  display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
  border:1px solid var(--border); background:rgba(255,255,255,0.025); border-radius:14px; padding:13px 6px;
  cursor:pointer; color:var(--text); will-change:transform;
}
.icon-card:hover{ border-color:var(--border-strong); }
.icon-card.selected{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent) inset; }
.icon-card .ic-badge{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;
}
.icon-card .ic-badge svg{ width:23px; height:23px; }
.icon-card .dot{ position:absolute; bottom:-2px; right:-2px; width:9px; height:9px; border-radius:50%; border:2px solid var(--bg-1); }
.icon-card .lbl{ font-size:11.5px; line-height:1.25; font-weight:500; color:var(--text-muted); }
.sev-safe .ic-badge{ background:var(--safe-soft); color:var(--safe); } .sev-safe .dot{ background:var(--safe); }
.sev-caution .ic-badge{ background:var(--caution-soft); color:var(--caution); } .sev-caution .dot{ background:var(--caution); }
.sev-danger .ic-badge{ background:var(--danger-soft); color:var(--danger); } .sev-danger .dot{ background:var(--danger); }
.emptynote{ color:var(--text-muted); font-size:13px; padding:14px 4px; }

.dropzone{
  border:1.5px dashed var(--border); border-radius:14px; padding:22px; text-align:center; cursor:pointer;
  color:var(--text-muted); font-size:13px; margin-bottom:10px; transition:border-color .16s ease, color .16s ease;
}
.dropzone:hover{ border-color:var(--accent); color:var(--text); }
.preview-wrap{ display:flex; gap:12px; align-items:flex-start; margin-top:10px; }
.preview-wrap img{ width:96px; height:96px; object-fit:cover; border-radius:12px; border:1px solid var(--border); }
.hint{ font-size:12.5px; color:var(--text-muted); line-height:1.5; }

/* ---------- result ---------- */
#resultCard{ border-color:transparent; padding:0; overflow:hidden; }
.sev-banner{ padding:20px 22px; display:flex; align-items:center; gap:14px; position:relative; overflow:hidden; }
.sev-banner .badge{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:none; background:rgba(255,255,255,.2); position:relative; z-index:1; backdrop-filter:blur(4px); }
.sev-banner .badge svg{ width:25px; height:25px; color:#fff; }
.sev-banner .tt{ color:#fff; position:relative; z-index:1; }
.sev-banner .tt .verdict{ font-family:"Manrope"; font-weight:800; font-size:18px; letter-spacing:-0.01em; }
.sev-banner .tt .name{ font-size:12.5px; opacity:.9; }
.sev-safe-bg{ background:linear-gradient(120deg,#12a87a,#0a6b4d 45%,#0f8a63); }
.sev-caution-bg{ background:linear-gradient(120deg,#c9891f,#8f5c05 45%,#b3760f); }
.sev-danger-bg{ background:linear-gradient(120deg,#d13a56,#8f1f38 45%,#b8294a); }
.result-body{ padding:22px; display:flex; flex-direction:column; gap:18px; }
.rblock .rh{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-bottom:7px; }
.rblock p{ margin:0; font-size:14.5px; line-height:1.6; color:var(--text); }
.checklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.checklist li{ display:flex; gap:9px; font-size:14px; line-height:1.4; }
.checklist li svg{ width:16px; height:16px; color:var(--accent); flex:none; margin-top:2px; }
.costrow{ display:flex; align-items:baseline; gap:8px; }
.costrow .val{ font-size:21px; font-weight:700; background:linear-gradient(90deg,var(--accent-bright),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.divider{ height:1px; background:var(--border); }
.submitrow{ display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
.submitrow textarea{ flex:1; min-width:200px; }

.btn{
  position:relative; overflow:hidden; border:none; border-radius:11px; padding:11px 18px; font-size:13.5px; font-weight:700; cursor:pointer;
  background:rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--border-strong);
}
.btn.primary{
  background:linear-gradient(120deg,var(--accent),var(--accent-2)); color:#04141a; border:none;
  background-size:160% 160%;
}
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn.ghost{ background:rgba(255,255,255,0.03); color:var(--text); border:1px solid var(--border); }
.btn.danger{ background:var(--danger); color:#2b0510; border:none; }
.btn.sm{ padding:8px 13px; font-size:12.5px; }
.status-msg{ font-size:13px; padding:8px 0 0; }
.status-msg.ok{ color:var(--safe); } .status-msg.err{ color:var(--danger); }

/* ---------- admin ---------- */
.rolebar{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); margin-bottom:20px; flex-wrap:wrap; }
.rolebar .chip{ background:var(--glass); border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-weight:600; font-size:12px; color:var(--text); }
.rolebar .spacer{ flex:1 1 auto; }
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
@media (max-width:760px){ .stat-grid{ grid-template-columns:1fr 1fr; } }
.stat-tile{
  background:linear-gradient(180deg, var(--glass), rgba(255,255,255,0.015)); border:1px solid var(--border); border-radius:14px;
  padding:16px 16px 14px; backdrop-filter:blur(8px);
}
.stat-tile .slabel{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:600; margin-bottom:8px; display:block; }

.stat-tile .ssub{ font-size:11.5px; color:var(--text-muted); margin-top:4px; }
.stat-tile.sys .sval{ font-size:14px; display:flex; align-items:center; gap:7px; }
.stat-tile.sys .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--safe); }
.stat-tile.sys.offline .status-dot{ background:var(--caution); animation:none; }

.admin-grid{ display:grid; grid-template-columns:1.15fr 1fr; gap:18px; align-items:start; }

.icon-row{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border); }
.icon-row:last-child{ border-bottom:none; }
.icon-row .ic-badge{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none; }
.icon-row .ic-badge svg{ width:16px; height:16px; }
.icon-row .nm{ flex:1; font-size:13.5px; font-weight:500; }
.icon-row .tag{ font-size:10.5px; color:var(--text-muted); background:var(--glass); border:1px solid var(--border); border-radius:6px; padding:2px 7px; }
.edit-panel{ border-top:1px solid var(--border); margin-top:10px; padding-top:16px; display:flex; flex-direction:column; gap:10px; }
.fld2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.fld3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
table.reports{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.reports th{ text-align:left; color:var(--text-dim); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; padding:0 8px 9px 0; border-bottom:1px solid var(--border); }
table.reports td{ padding:9px 8px 9px 0; border-bottom:1px solid var(--border); vertical-align:top; color:var(--text); }
.tablewrap{ overflow-x:auto; }
.disclaimer{ color:var(--text-dim); font-size:12px; text-align:center; padding-top:8px; line-height:1.6; }

.restricted{ text-align:center; padding:40px 20px; }
.restricted .lockwrap{ width:52px; height:52px; margin:0 auto 16px; border-radius:16px; background:var(--glass); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; color:var(--accent); }
.restricted h3{ font-size:18px; margin:0 0 8px; }
.restricted p{ color:var(--text-muted); font-size:13.5px; max-width:46ch; margin:0 auto 6px; line-height:1.6; }
.restricted .note{ color:var(--text-dim); font-size:12px; margin-top:10px; }
.loginform{ display:flex; flex-direction:column; gap:12px; max-width:320px; margin:18px auto 0; text-align:left; }
.loginform label{ margin-bottom:6px; }

var ICON_MAP = {}; ICONS.forEach(function(i){ ICON_MAP[i.id]=i; });

/* ---------- Firebase wiring ----------
   Everything the ADMIN can do is enforced twice: here (so the UI hides
   controls the visitor can't use) and — the part that actually matters —
   in firestore.rules on Firebase's own servers, keyed on ADMIN_UID. A
   visitor who never signs in, or who signs into a different account,
   is rejected by Firestore itself even if they call the SDK directly from
   the browser console; this file only decides what to SHOW.
*/
var FB = null, auth = null, fdb = null, ADMIN_UID = null;
var fbFns = {};
var currentUser = null, authReady = false, canEdit = false, myId = null;
var overrides={}, customIcons=[], reports=[];
var unsubReports = null;

function mergedIcon(base){
  var ov = overrides[base.id];
  if(!ov) return base;
  var out = JSON.parse(JSON.stringify(base));
  if(ov.severity) out.severity = ov.severity;
  if(ov.cost) out.cost = ov.cost;
  ['ru','uz','en'].forEach(function(l){
    if(ov[l]){
      if(ov[l].name) out[l].name = ov[l].name;
      if(ov[l].meaning) out[l].meaning = ov[l].meaning;
      if(ov[l].checks) out[l].checks = ov[l].checks;
      if(ov[l].service) out[l].service = ov[l].service;
    }
  });
  return out;
}
function allIcons(){
  return ICONS.map(mergedIcon).concat(customIcons);
}

function startFirebase(){
  FB = window.__AUTOHELP_FB__;
  if(!FB){ renderRoleChip(); renderAdmin(); return; }
  auth = FB.auth; fdb = FB.fdb; ADMIN_UID = FB.ADMIN_UID;
  fbFns = FB;

  // Public, read-only for every visitor (allowed by firestore.rules for anyone) —
  // this is what makes the client-facing gallery/results reflect admin edits.
  try{
    fbFns.onSnapshot(fbFns.collection(fdb,'icon_overrides'), function(snap){
      var o={}; snap.forEach(function(d){ o[d.id]=d.data(); }); overrides=o;
      renderGallery(); renderResult(); renderAdmin();
    }, function(){ /* rules reject silently -> keep defaults */ });
    fbFns.onSnapshot(fbFns.collection(fdb,'custom_icons'), function(snap){
      customIcons = snap.docs.map(function(d){ var v=d.data(); v.id=d.id; v.custom=true; return v; });
      renderGallery(); renderResult(); renderAdmin();
    }, function(){});
  }catch(e){}

  fbFns.onAuthStateChanged(auth, function(user){
    currentUser = user;
    myId = user ? user.uid : null;
    canEdit = !!(user && ADMIN_UID && user.uid === ADMIN_UID);
    authReady = true;
    renderRoleChip(); renderAdmin();
    if(canEdit){ subscribeReports(); } else { unsubscribeReports(); reports=[]; renderAdmin(); }
  });
}

function subscribeReports(){
  if(unsubReports || !fdb) return;
  try{
    unsubReports = fbFns.onSnapshot(
      fbFns.query(fbFns.collection(fdb,'reports'), fbFns.orderBy('submittedAt','desc'), fbFns.limit(200)),
      function(snap){
        reports = snap.docs.map(function(d){ var v=d.data(); v._id=d.id; return v; });
        renderAdmin();
      }, function(){ /* not admin, or offline */ }
    );
  }catch(e){}
}
function unsubscribeReports(){
  if(unsubReports){ try{ unsubReports(); }catch(e){} unsubReports=null; }
}

function animateCount(el, to){
  if(!el) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = to; return; }
  var from = 0, start = null, dur = 700;
  function step(ts){
    if(!start) start = ts;
    var p = Math.min(1, (ts-start)/dur);
    var eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(from + (to-from)*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

async function saveEdit(isNew, id, isCustom){
  var data = readForm();
  var statusEl = document.getElementById('editStatus');
  try{
    if(isNew){
      var record = Object.assign({}, data, {custom:true, en:{name:data.ru.name, meaning:data.ru.meaning, checks:data.ru.checks, service:data.ru.service}});
      await fbFns.addDoc(fbFns.collection(fdb,'custom_icons'), record);
    } else if(isCustom){
      await fbFns.updateDoc(fbFns.doc(fdb,'custom_icons',id), data);
    } else {
      await fbFns.setDoc(fbFns.doc(fdb,'icon_overrides',id), data);
    }
    statusEl.textContent = t('save_ok'); statusEl.className='status-msg ok';
    editingId=null; setTimeout(renderEditPanel,400);
  }catch(e){
    statusEl.textContent = t('save_err'); statusEl.className='status-msg err';
  }
}

  try{ await fbFns.deleteDoc(fbFns.doc(fdb,'icon_overrides',id)); }catch(e){}

async function deleteCustom(id){
  try{ await fbFns.deleteDoc(fbFns.doc(fdb,'custom_icons',id)); }catch(e){}

  var body = document.getElementById('reportsBody'); if(!body) return;
  var empty = document.getElementById('reportsEmpty');
  if(!reports.length){ body.innerHTML=''; if(empty) empty.hidden=false; return; }
  if(empty) empty.hidden = true;
  body.innerHTML = reports.slice(0,50).map(function(r){
    var d = r.submittedAt ? new Date(r.submittedAt) : null;
    var ds = d ? (d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})) : '—';
    return '<tr><td class="mono">'+ds+'</td><td>'+esc(r.carLine||'—')+'</td><td>'+esc(r.iconName||r.iconId||'—')+'</td><td>'+esc(r.comment||'—')+'</td></tr>';
  }).join('');
}

/* ---------- premium micro-interactions ---------- */
var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var isCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

function addMagnetic(el, strength){
  if(!el || reduceMotion || isCoarsePointer) return;
  strength = strength || 6;
  el.addEventListener('mousemove', function(e){
    var r = el.getBoundingClientRect();
    var mx = (e.clientX - r.left - r.width/2)/(r.width/2);
    var my = (e.clientY - r.top - r.height/2)/(r.height/2);
    el.style.transform = 'translate('+(mx*strength).toFixed(1)+'px,'+(my*strength).toFixed(1)+'px)';
  });
  el.addEventListener('mouseleave', function(){ el.style.transform = ''; });
}

function setupRipple(){
  document.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('.btn');
    if(!btn || reduceMotion) return;
    var r = btn.getBoundingClientRect();
    var span = document.createElement('span');
    var size = Math.max(r.width, r.height) * 1.4;
    span.className = 'ripple';
    span.style.width = span.style.height = size+'px';
    span.style.left = (e.clientX - r.left - size/2)+'px';
    span.style.top = (e.clientY - r.top - size/2)+'px';
    btn.appendChild(span);
    setTimeout(function(){ span.remove(); }, 600);
  });
}

function setupCursorGlow(){
  if(isCoarsePointer) return;
  var glow = document.getElementById('cursorGlow');
  if(!glow) return;
  var tx=0, ty=0, cx=0, cy=0, active=false;
  window.addEventListener('mousemove', function(e){
    tx = e.clientX; ty = e.clientY;
    if(!active){ active=true; glow.style.opacity='1'; }
  }, {passive:true});
  document.addEventListener('mouseleave', function(){ glow.style.opacity='0'; });
  function loop(){
    cx += (tx-cx)*0.12; cy += (ty-cy)*0.12;
    glow.style.transform = 'translate('+cx+'px,'+cy+'px)';
    requestAnimationFrame(loop);
  }
  loop();
}

function setupTilt(){
  var el = document.querySelector('.instrument');
  if(!el || reduceMotion || isCoarsePointer) return;
  el.style.transformStyle = 'preserve-3d';
  el.style.willChange = 'transform';
  el.parentElement.style.perspective = '900px';
  el.addEventListener('mousemove', function(e){
    var r = el.getBoundingClientRect();
    var px = (e.clientX - r.left)/r.width - 0.5;
    var py = (e.clientY - r.top)/r.height - 0.5;
    el.style.transform = 'rotateY('+(px*8).toFixed(1)+'deg) rotateX('+(-py*8).toFixed(1)+'deg)';
  });
  el.addEventListener('mouseleave', function(){ el.style.transform = ''; });
}

function setupParticles(){
  var canvas = document.getElementById('bgCanvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var w,h,dpr = Math.min(window.devicePixelRatio||1, 2);
  var nodes = [];
  var N = reduceMotion ? 0 : (window.innerWidth < 640 ? 34 : 58);
  function resize(){
    w = window.innerWidth; h = Math.min(window.innerHeight, 900);
    canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);
  for(var i=0;i<N;i++){
    nodes.push({ x:Math.random()*w, y:Math.random()*h*0.9, vx:(Math.random()-0.5)*0.18, vy:(Math.random()-0.5)*0.18, r:Math.random()*1.4+0.6 });
  }
  var paused = false;
  document.addEventListener('visibilitychange', function(){ paused = document.hidden; });
  function frame(){
    if(!paused && N>0){
      ctx.clearRect(0,0,w,h);
      for(var i=0;i<nodes.length;i++){
        var n = nodes[i];
        n.x += n.vx; n.y += n.vy;
        if(n.x<0||n.x>w) n.vx*=-1;
        if(n.y<0||n.y>h*0.9) n.vy*=-1;
      }
      for(var i=0;i<nodes.length;i++){
        for(var j=i+1;j<nodes.length;j++){
          var a=nodes[i], b=nodes[j];
          var dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
          if(d<120){
            ctx.strokeStyle = 'rgba(120,190,210,'+(0.12*(1-d/120))+')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      for(var i=0;i<nodes.length;i++){
        var n = nodes[i];
        ctx.fillStyle = 'rgba(160,220,235,0.55)';
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
      }
      requestAnimationFrame(frame);
    } else if(N>0){
      requestAnimationFrame(frame);
    }
  }
  if(N>0) frame();
}

setupParticles();
setupCursorGlow();
setupTilt();
setupRipple();
})();
